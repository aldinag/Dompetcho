name: CI

# Runs the same three checks every change has been verified against by hand throughout
# development: typecheck, lint, jest. Native (Android/iOS) builds aren't run here yet —
# they need SDK setup and a lot more runner time; add a separate workflow for those later
# if real-device build breakage becomes a recurring problem.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci
