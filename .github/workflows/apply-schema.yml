name: Apply Supabase schema

# Runs supabase/schema.sql against the live Supabase project, so a PR that adds or changes a
# database function/column (e.g. the server-side totals RPCs) doesn't leave the installed app
# erroring with "Could not find the function ... in the schema cache" until someone pastes the
# SQL into the dashboard by hand.
#
# MANUAL ONLY (Actions tab > Apply Supabase schema > Run workflow) and only from `dev`/`main`.
# It is deliberately not triggered by pushes: this edits the production database, and a
# schema.sql change should be read by a human before it's applied. schema.sql is written to be
# safely re-runnable (`if not exists`, guarded one-time migrations, drop-and-recreate of
# policies/functions), and the whole file is sent as one request so Postgres runs it as a single
# transaction — a failure part-way rolls everything back rather than leaving a half-applied schema.
#
# Uses the same secrets as keep-db-alive.yml: DOMPETCHO_ENV_TS (to find the project ref) and
# SUPABASE_ACCESS_TOKEN (Management API personal access token).
on:
  workflow_dispatch:

jobs:
  apply:
    name: Apply schema.sql
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run schema.sql against the Supabase project
        env:
          ENV_TS: ${{ secrets.DOMPETCHO_ENV_TS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -u

          if [ -z "$ENV_TS" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::DOMPETCHO_ENV_TS and SUPABASE_ACCESS_TOKEN secrets are both required."
            exit 1
          fi

          SUPABASE_URL=$(printf '%s\n' "$ENV_TS" | sed -nE "s/^export const SUPABASE_URL = ['\"]([^'\"]+)['\"].*/\1/p" | head -n1)
          PROJECT_REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::Couldn't read SUPABASE_URL from DOMPETCHO_ENV_TS."
            exit 1
          fi

          # `notify pgrst, 'reload schema'` makes the API pick up new functions immediately
          # instead of after its own cache refresh.
          { cat supabase/schema.sql; printf "\n\nnotify pgrst, 'reload schema';\n"; } > "$RUNNER_TEMP/full.sql"
          jq -Rs '{query: .}' "$RUNNER_TEMP/full.sql" > "$RUNNER_TEMP/payload.json"

          query() {
            curl -sS --max-time 120 -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$1" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" || true
          }

          echo "Applying supabase/schema.sql ($(wc -l < supabase/schema.sql) lines)…"
          CODE=$(query "$RUNNER_TEMP/payload.json")
          echo "Supabase responded HTTP $CODE"
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::Schema was NOT applied (HTTP $CODE). Response:"
            cat "$RUNNER_TEMP/resp.json"; echo
            exit 1
          fi

          # Prove the functions the app calls now exist.
          jq -n --arg q "select proname from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and proname in ('expense_totals', 'expense_breakdown_by_month') order by 1" '{query: $q}' > "$RUNNER_TEMP/verify.json"
          CODE=$(query "$RUNNER_TEMP/verify.json")
          echo "Verification query HTTP $CODE:"
          cat "$RUNNER_TEMP/resp.json"; echo
          for fn in expense_totals expense_breakdown_by_month; do
            grep -q "\"$fn\"" "$RUNNER_TEMP/resp.json" || { echo "::error::$fn is missing after applying the schema."; exit 1; }
          done
          echo "Schema applied and both RPCs exist."
